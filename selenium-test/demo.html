<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Selenium 登录测试</title>
</head>

<body>

    <h1 id="title">登录测试</h1>

    <div>
        <label for="username">用户名：</label>
        <input
            id="username"
            type="text"
            placeholder="请输入用户名"
        >
    </div>

    <br>

    <div>
        <label for="password">密码：</label>
        <input
            id="password"
            type="password"
            placeholder="请输入密码"
        >
    </div>

    <br>

    <button id="loginBtn" onclick="login()">
        登录
    </button>

    <p id="result"></p>

    <script>
        function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const result =
                document.getElementById("result");

            if (
                username === "admin" &&
                password === "123456"
            ) {
                result.innerText = "登录成功";
            } else {
                result.innerText = "用户名或密码错误";
            }
        }
    </script>

</body>

</html>
